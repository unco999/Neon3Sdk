[package]
name = "neon3-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust client SDK for the Neon3 control-plane protocol"
repository = "https://github.com/unco999/Neon3Sdk"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]

[[bin]]
name = "sdk_probe"
path = "src/bin/sdk_probe.rs"
